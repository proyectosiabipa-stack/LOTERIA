<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Skeeter Protocol: BIPA Edition</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050508;
            font-family: 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            position: fixed;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #121824 0%, #05070a 100%);
        }
        canvas { 
            display: block; 
            touch-action: none; 
        }
        .ui-layer {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            display: flex; 
            flex-direction: column;
            justify-content: space-between; 
            padding: 12px;
        }
        .hud-top { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            width: 100%; 
            max-width: 480px; 
            margin: 0 auto; 
            gap: 10px;
        }
        .bipa-brand { 
            font-size: 0.65rem; 
            font-weight: bold; 
            color: #00f2fe; 
            margin-bottom: 2px; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            white-space: nowrap;
        }
        .hud-panel { 
            background: rgba(10, 14, 23, 0.85); 
            backdrop-filter: blur(8px); 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            border-radius: 10px; 
            padding: 8px 12px; 
            pointer-events: auto; 
            flex: 1;
        }
        .hud-value { 
            font-size: 1.1rem; 
            font-weight: 800; 
            color: #fff; 
        }
        .screen-overlay {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(5, 7, 10, 0.92); 
            backdrop-filter: blur(12px);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            pointer-events: auto; 
            z-index: 10;
            padding: 20px;
        }
        .screen-overlay.hidden { display: none; }
        .modal-card {
            background: linear-gradient(135deg, rgba(20, 28, 45, 0.98) 0%, rgba(10, 14, 23, 0.98) 100%);
            border: 1px solid #00f2fe; 
            border-radius: 16px; 
            padding: 24px; 
            max-width: 380px; 
            width: 100%; 
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
        }
        h1 { color: #00f2fe; font-size: 1.4rem; margin: 0 0 10px 0; }
        p { color: #94a3b8; font-size: 0.85rem; line-height: 1.4; margin: 0 0 20px 0; }
        .btn-primary {
            background: #00f2fe; 
            color: #05070a; 
            border: none; 
            padding: 14px 20px;
            font-size: 0.9rem; 
            font-weight: 800; 
            border-radius: 8px; 
            cursor: pointer;
            text-transform: uppercase; 
            width: 100%;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-primary:active { transform: scale(0.96); }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-layer">
            <div class="hud-top">
                <div class="hud-panel">
                    <div class="bipa-brand">Productos BIPA</div>
                    <span id="hud-timer" class="hud-value">30.0s</span>
                </div>
                <div class="hud-panel" style="text-align: right;">
                    <div class="bipa-brand">Objetivo: Varillas</div>
                    <span id="hud-score" class="hud-value">0</span>
                </div>
            </div>
        </div>
        <div id="start-screen" class="screen-overlay">
            <div class="modal-card">
                <h1>Productos BIPA</h1>
                <p>Defiende tu hogar de la plaga invasora. Si logras resistir el asalto, obtendrás tus <b>Varillas Repelentes Productos BIPA</b>.</p>
                <button class="btn-primary" id="start-btn">Iniciar Protección</button>
            </div>
        </div>
        <div id="gameover-screen" class="screen-overlay hidden">
            <div class="modal-card">
                <h1 id="gameover-title">MISIÓN CUMPLIDA</h1>
                <p id="gameover-desc">Procesando resultados...</p>
                <button class="btn-primary" id="restart-btn">Reiniciar Asalto</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, centerX, centerY;
        let gameState = 'START';
        let gameTimer = 30.0;
        let score = 0;
        let enemies = [];
        let spawnTimer = 0;

        function resize() {
            width = window.innerWidth; 
            height = window.innerHeight;
            canvas.width = width; 
            canvas.height = height;
            centerX = width / 2; 
            centerY = height / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        class Enemy {
            constructor() {
                this.type = Math.random() > 0.4 ? 'mosquito' : 'fly';
                this.radius = 18; 
                
                const side = Math.floor(Math.random() * 4);
                if (side === 0) { this.x = Math.random() * width; this.y = -40; }
                else if (side === 1) { this.x = width + 40; this.y = Math.random() * height; }
                else if (side === 2) { this.x = Math.random() * width; this.y = height + 40; }
                else { this.x = -40; this.y = Math.random() * height; }
                
                this.speed = Math.random() * 1.0 + 1.8; 
                this.wingPhase = Math.random() * Math.PI * 2;
                this.wobbleSpeed = Math.random() * 0.1 + 0.1;
            }

            update() {
                const dx = centerX - this.x;
                const dy = centerY - this.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 1) {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
                this.wingPhase += this.wobbleSpeed * 3;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                const angleToCenter = Math.atan2(centerY - this.y, centerX - this.x);
                ctx.rotate(angleToCenter);

                if (this.type === 'mosquito') {
                    ctx.fillStyle = '#1e293b';
                    ctx.strokeStyle = '#38bdf8';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(22, 0);
                    ctx.stroke();

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    const wingOffset = Math.sin(this.wingPhase) * 10;
                    ctx.beginPath();
                    ctx.ellipse(-2, -8 - wingOffset, 8, 3, -0.3, 0, Math.PI * 2);
                    ctx.ellipse(-2, 8 + wingOffset, 8, 3, 0.3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#0f172a';
                    ctx.strokeStyle = '#a855f7';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.arc(0, 0, 11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    const wingOffset = Math.sin(this.wingPhase) * 9;
                    ctx.beginPath();
                    ctx.ellipse(-1, -10 - wingOffset, 7, 4, -0.2, 0, Math.PI * 2);
                    ctx.ellipse(-1, 10 + wingOffset, 7, 4, 0.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function drawCentralHouse() {
            ctx.save();
            ctx.translate(centerX, centerY);

            ctx.shadowColor = 'rgba(0, 242, 254, 0.3)';
            ctx.shadowBlur = 20;

            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#00f2fe';
            ctx.lineWidth = 2.5;
            ctx.fillRect(-40, -12, 80, 50);
            ctx.strokeRect(-40, -12, 80, 50);

            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.moveTo(-48, -12);
            ctx.lineTo(0, -55);
            ctx.lineTo(48, -12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#05070a';
            ctx.fillRect(-10, 12, 20, 26);
            ctx.strokeRect(-10, 12, 20, 26);

            ctx.fillStyle = '#00f2fe';
            ctx.fillRect(-28, -2, 10, 12);
            ctx.fillRect(18, -2, 10, 12);

            ctx.restore();
        }

        function startGame() {
            gameState = 'PLAYING';
            gameTimer = 30.0; 
            score = 0; 
            enemies = [];
            spawnTimer = 0;
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (gameState !== 'PLAYING') return;
            const delta = 0.016;
            gameTimer -= delta;
            
            spawnTimer += delta;
            if (spawnTimer >= 0.55) { 
                spawnTimer = 0;
                enemies.push(new Enemy());
                if(Math.random() > 0.4) {
                    enemies.push(new Enemy());
                }
            }

            for (let i = 0; i < enemies.length; i++) {
                let e = enemies[i];
                e.update();
                if(Math.hypot(e.x - centerX, e.y - centerY) < 35) {
                    gameState = 'GAMEOVER';
                    document.getElementById('gameover-screen').classList.remove('hidden');
                    document.getElementById('gameover-title').textContent = "TU CASA HA SIDO INVADIDA";
                    document.getElementById('gameover-desc').textContent = "La base fue superada. Los insectos rompieron el perímetro de Productos BIPA.";
                    return;
                }
            }

            if (gameTimer <= 0) {
                gameState = 'GAMEOVER';
                document.getElementById('gameover-screen').classList.remove('hidden');
                document.getElementById('gameover-title').textContent = "¡HAS GANADO!";
                document.getElementById('gameover-desc').textContent = "¡Has ganado! Te has ganado una caja de varillas repelentes Productos BIPA.";
                return;
            }

            ctx.clearRect(0, 0, width, height);
            drawCentralHouse();
            enemies.forEach(e => e.draw());
            
            document.getElementById('hud-timer').textContent = gameTimer.toFixed(1) + 's';
            document.getElementById('hud-score').textContent = score;

            requestAnimationFrame(gameLoop);
        }

        function handleTouchInput(e) {
            if (gameState !== 'PLAYING') return;
            e.preventDefault(); 

            const touches = e.changedTouches;
            for (let t = 0; t < touches.length; t++) {
                const touchX = touches[t].clientX;
                const touchY = touches[t].clientY;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let en = enemies[i];
                    if (Math.hypot(touchX - en.x, touchY - en.y) < 65) {
                        enemies.splice(i, 1);
                        score++;
                        document.getElementById('hud-score').textContent = score;
                        break;
                    }
                }
            }
        }

        canvas.addEventListener('touchstart', handleTouchInput, { passive: false });
        canvas.addEventListener('mousedown', (e) => {
            if (gameState !== 'PLAYING') return;
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                if (Math.hypot(e.clientX - en.x, e.clientY - en.y) < 65) {
                    enemies.splice(i, 1);
                    score++;
                    document.getElementById('hud-score').textContent = score;
                    break;
                }
            }
        });

        document.getElementById('start-btn').onclick = startGame;
        document.getElementById('restart-btn').onclick = startGame;
    </script>
</body>
</html>
