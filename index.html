<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIPA - Elige tu Carta de la Suerte</title>
    <!-- Librería externa para la animación de confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2e4d38; /* Verde manzana oscuro / mate corporativo */
            color: #ffffff;
            text-align: center;
            padding: 10px;
            margin: 0;
        }

        /* Estilo elegante para el logotipo en la esquina superior izquierda */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 25px;
            width: 140px;
        }
        .logo-container img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            background: #ffffff; /* Fondo blanco limpio para respetar el diseño original del logo */
            padding: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Tipografía sobria y profesional para los textos principales */
        header {
            margin-top: 30px;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        h1 { 
            color: #ffffff; 
            font-size: 24px; 
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 8px; 
        }
        p { 
            font-size: 15px; 
            color: #cce3d1; 
            font-weight: 400;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Cuadrícula de 10x10 (100 cartas) */
        #tablero {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            max-width: 650px;
            margin: 0 auto;
            padding: 15px;
            background: rgba(30, 53, 37, 0.6);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border: 2px solid #3d664b;
        }

        /* Estructura de la carta y efecto 3D */
        .carta {
            aspect-ratio: 1 / 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .carta-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* Cuando la carta se voltea */
        .carta.volteada .carta-inner {
            transform: rotateY(180deg);
        }

        /* Cara frontal y trasera de la carta */
        .carta-front, .carta-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
        }

        /* Parte trasera de la carta (Verde manzana mate) */
        .carta-front {
            background: linear-gradient(135deg, #437050, #365b41);
            color: #d4edda;
            border: 2px solid #528661;
            font-size: 16px;
        }
        .carta-front:hover {
            background: linear-gradient(135deg, #4c7e5a, #3f694c);
            transform: scale(1.05);
        }

        /* Resultado */
        .carta-back {
            transform: rotateY(180deg);
            font-size: 10px;
            padding: 2px;
            text-align: center;
        }

        /* Carta Vacía */
        .vacia {
            background-color: #24382a;
            color: #8fa895;
            border: 2px solid #314d3a;
        }

        /* Carta Ganadora */
        .ganadora {
            background-color: #a8d5ba;
            color: #1e3525;
            border: 2px solid #ffffff;
            font-size: 22px;
            animation: latido 0.8s infinite alternate;
        }

        @keyframes latido {
            from { transform: rotateY(180deg) scale(1); }
            to { transform: rotateY(180deg) scale(1.08); }
        }

        /* Botón de reinicio */
        #reiniciarBtn {
            display: none;
            margin: 25px auto;
            padding: 12px 25px;
            background-color: #437050;
            color: white;
            border: 2px solid #82b391;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }
        #reiniciarBtn:hover { background-color: #4c7e5a; }
    </style>
</head>
<body>

    <!-- Logo de BIPA embebido directamente -->
    <div class="logo-container">
        <!-- 
          Opción 1: Imagen embebida en base64 para que funcione de inmediato sin archivos externos.
          (Puedes reemplazar el contenido "data:image/svg+xml;base64,..." por el código en base64 de tu logo real).
        -->
        <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAiIGhlaWdodD0iMTAwIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjNDM3MDUwIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtc2l6ZT0iMjAiIGZpbGw9IiNmZmYiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGR5PSIuM2VtIj5CSVBBLjwvdGV4dD48L3N2Zz4=" alt="Logo BIPA">
        
        <!-- 
          Opción 2: Si prefieres usar una imagen en archivo local o enlace web, solo comenta la línea de arriba y usa esta:
          <img src="logo.png" alt="Logo BIPA">
        -->
    </div>

    <!-- Títulos actualizados y con estilo sobrio -->
    <header>
        <h1>Descubre tu suerte con Productos BIPA</h1>
        <p>100 cartas, una sola oportunidad para llevarte el producto gratis.</p>
    </header>

    <div id="tablero"></div>

    <button id="reiniciarBtn" onclick="iniciarJuego()">Reiniciar Tablero</button>

    <script>
        const tableroDiv = document.getElementById('tablero');
        const reiniciarBtn = document.getElementById('reiniciarBtn');
        
        const totalCartas = 100;
        let juegoTerminado = false;

        function iniciarJuego() {
            tableroDiv.innerHTML = '';
            reiniciarBtn.style.display = 'none';
            juegoTerminado = false;

            let cartasArray = new Array(totalCartas).fill("vacia");
            cartasArray[0] = "ganadora"; 

            for (let i = cartasArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cartasArray[i], cartasArray[j]] = [cartasArray[j], cartasArray[i]];
            }

            for (let i = 0; i < totalCartas; i++) {
                crearCarta(cartasArray[i]);
            }
        }

        function crearCarta(tipo) {
            const carta = document.createElement('div');
            carta.className = 'carta';

            const cartaInner = document.createElement('div');
            cartaInner.className = 'carta-inner';

            const cartaFront = document.createElement('div');
            cartaFront.className = 'carta-front';
            cartaFront.innerText = "🎁";

            const cartaBack = document.createElement('div');
            cartaBack.className = `carta-back ${tipo}`;
            
            if (tipo === "ganadora") {
                cartaBack.innerHTML = "👑"; 
            } else {
                cartaBack.innerHTML = "Vacía";
            }

            cartaInner.appendChild(cartaFront);
            cartaInner.appendChild(cartaBack);
            carta.appendChild(cartaInner);

            carta.addEventListener('click', () => {
                if (juegoTerminado || carta.classList.contains('volteada')) return;

                carta.classList.add('volteada');

                if (tipo === "ganadora") {
                    juegoTerminado = true;
                    
                    confetti({
                        particleCount: 150,
                        spread: 80,
                        origin: { y: 0.6 }
                    });

                    setTimeout(() => {
                        alert("¡Felicidades! Tu suerte está asegurada con la calidad de Productos BIPA. ¡Has ganado tu producto gratis!");
                        revelarTodas();
                    }, 400);
                } else {
                    verificarSiQuedanPremios();
                }
            });

            tableroDiv.appendChild(carta);
        }

        function revelarTodas() {
            const todas = document.querySelectorAll('.carta');
            todas.forEach(c => c.classList.add('volteada'));
            reiniciarBtn.style.display = 'block';
        }

        function verificarSiQuedanPremios() {
            const volteadas = document.querySelectorAll('.carta.volteada').length;
            if (volteadas >= 95) {
                reiniciarBtn.style.display = 'block';
            }
        }

        iniciarJuego();
    </script>
</body>
</html>
